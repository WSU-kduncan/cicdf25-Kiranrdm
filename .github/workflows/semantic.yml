name: Build & Push Versioned Docker Image

# triggers on semantic tags like v1.2.3
on:
  push:
    tags:
      - "v*.*.*"   

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
    
      # login to DockerHub using secrets
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract version components
        id: version
        run: |
          # GITHUB_REF looks like: refs/tags/v1.2.3
          TAG="${GITHUB_REF#refs/tags/}"   # -> v1.2.3
          VER="${TAG#v}"                   # -> 1.2.3 (strip leading 'v')
          MAJOR="${VER%%.*}"               # -> 1
          MAJORMINOR="${VER%.*}"           # -> 1.2
          echo "tag=${VER}" >> $GITHUB_OUTPUT
          echo "major=${MAJOR}" >> $GITHUB_OUTPUT
          echo "majorminor=${MAJORMINOR}" >> $GITHUB_OUTPUT

      - name: Build & Push Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./web-content/Dockerfile
          push: true
          tags: |
            kiranrdm/about-me-site:latest
            kiranrdm/about-me-site:${{ steps.version.outputs.major }}
            kiranrdm/about-me-site:${{ steps.version.outputs.majorminor }}
            kiranrdm/about-me-site:${{ steps.version.outputs.tag }}